<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ᑕIᑎᑎᗩᗰOᑎᖇOᒪᒪ ☁️</title>

  <link
    rel="stylesheet"
    href="style.css?v=7"
  >
<link
  rel="stylesheet"
  href="games.css?v=2"
>
  
</head>

<body>

  <main class="game">

    <h1>ᑕIᑎᑎᗩᗰOᑎᖇOᒪᒪ ☁️</h1>


    <!-- ========================= -->
    <!-- STATUS -->
    <!-- ========================= -->

    <div class="status-panel">

      <div class="status">

        <span class="status-icon">❤️</span>

        <div class="status-info">

          <span>Felicidade</span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="happiness-bar"
            ></div>

          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-icon">🍰</span>

        <div class="status-info">

          <span>Comida</span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="hunger-bar"
            ></div>

          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-icon">⚡</span>

        <div class="status-info">

          <span>Energia</span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="energy-bar"
            ></div>

          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-icon">🫧</span>

        <div class="status-info">

          <span>Higiene</span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="hygiene-bar"
            ></div>

          </div>

        </div>

      </div>

    </div>


    <!-- ========================= -->
    <!-- CÔMODO -->
    <!-- ========================= -->

    <section
      class="room"
      data-room="home"
    >


      <!-- ========================= -->
      <!-- PERSONAGEM -->
      <!-- ========================= -->

      <div class="cinna-wrap">


        <!--
          Corações, bolhas e Zzz
          aparecem nessa camada.
          Ela fica atrás do Cinna.
        -->

        <div
          id="effect-layer"
          class="effect-layer"
        ></div>


        <img
          id="cinna"
          class="character"
          src="assets/sprites/cinna-idle-1.PNG"
          alt="Cinna"
        >


        <!--
          Sujeira fica por cima do personagem.
        -->

        <img
          id="dirt-overlay"
          class="dirt-overlay"
          src="assets/sprites/sujeira-1.PNG"
          alt=""
          hidden
        >


      </div>


      <!-- ========================= -->
      <!-- MENU -->
      <!-- ========================= -->

      <nav class="game-menu">


        <button
          class="menu-button active"
          data-room="home"
        >

          <span>🏠</span>
          <small>Início</small>

        </button>


        <button
          class="menu-button"
          data-room="kitchen"
        >

          <span>🍰</span>
          <small>Comida</small>

        </button>


        <button
          class="menu-button"
          data-room="bathroom"
        >

          <span>🫧</span>
          <small>Banho</small>

        </button>


        <button
          class="menu-button"
          data-room="bedroom"
        >

          <span>💡</span>
          <small>Dormir</small>

        </button>


        <button
          class="menu-button"
          data-room="games"
        >

          <span>🎮</span>
          <small>Jogos</small>

        </button>


      </nav>


      <!-- ========================= -->
      <!-- COMIDA -->
      <!-- ========================= -->

      <div
        id="food-tray"
        class="food-tray"
        hidden
      >


        <button
          class="food-item"
          data-food="Morango"
          data-value="25"
        >

          <span>🍓</span>
          <small>+25%</small>

        </button>


        <button
          class="food-item"
          data-food="Maçã"
          data-value="35"
        >

          <span>🍎</span>
          <small>+35%</small>

        </button>


        <button
          class="food-item"
          data-food="Leite"
          data-value="30"
        >

          <span>🥛</span>
          <small>+30%</small>

        </button>


        <button
          class="food-item"
          data-food="Bolo"
          data-value="50"
        >

          <span>🍰</span>
          <small>+50%</small>

        </button>


      </div>


      <!-- ========================= -->
      <!-- BANHO -->
      <!-- ========================= -->

      <div
        id="bath-tray"
        class="bath-tray"
        hidden
      >


        <button
          class="bath-item"
          data-care="Esponja"
          data-value="25"
        >

          <span>🧽</span>
          <small>+25%</small>

        </button>


        <button
          class="bath-item"
          data-care="Sabonete"
          data-value="35"
        >

          <span>🧼</span>
          <small>+35%</small>

        </button>


        <button
          class="bath-item"
          data-care="Shampoo"
          data-value="40"
        >

          <span>🧴</span>
          <small>+40%</small>

        </button>


        <button
          class="bath-item"
          data-care="Enxágue"
          data-value="20"
        >

          <span>🚿</span>
          <small>+20%</small>

        </button>


      </div>


      <!-- ========================= -->
      <!-- SONO -->
      <!-- ========================= -->

      <div
        id="sleep-tray"
        class="sleep-tray"
        hidden
      >


        <button
          id="sleep-button"
          class="sleep-button"
        >

          <span>💡</span>
          <small>Dormir</small>

        </button>


      </div>


      <!-- ========================= -->
      <!-- MENSAGEM -->
      <!-- ========================= -->

      <p id="message">
        Cinna está esperando você ♡
      </p>


    </section>

  </main>


<script src="game.js?v=9"></script>
<script src="games.js?v=2"></script>
  
</body>
</html>
