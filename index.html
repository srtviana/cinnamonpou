<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CinnamonPou</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">
    <h1>CinnamonPou ☁️</h1>
<div class="status-panel">

  <div class="status">
    <span class="status-icon">❤️</span>

    <div class="status-info">
      <span>Felicidade</span>

      <div class="status-bar">
        <div
          class="status-fill"
          id="happiness-bar"
          style="width: 90%;"
        ></div>
      </div>
    </div>
  </div>


  <div class="status">
    <span class="status-icon">🍰</span>

    <div class="status-info">
      <span>Fome</span>

      <div class="status-bar">
        <div
          class="status-fill"
          id="hunger-bar"
          style="width: 80%;"
        ></div>
      </div>
    </div>
  </div>


  <div class="status">
    <span class="status-icon">⚡</span>

    <div class="status-info">
      <span>Energia</span>

      <div class="status-bar">
        <div
          class="status-fill"
          id="energy-bar"
          style="width: 100%;"
        ></div>
      </div>
    </div>
  </div>

</div>
    <section class="room">
      <img
  id="cinna"
  class="character"
  src="assets/sprites/cinna-idle-1.PNG"
  alt="Cinna"
>

      <p id="message">Cinna está esperando você ♡</p>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
