<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ᑕIᑎᑎᗩᗰOᑎᖇOᒪᒪ ☁️
  </title>


  <!-- CSS PRINCIPAL -->

  <link
    rel="stylesheet"
    href="style.css?v=7"
  >


  <!-- MINIJOGOS -->

  <link
    rel="stylesheet"
    href="games.css?v=3"
  >


  <!-- LOJA -->

  <link
    rel="stylesheet"
    href="shop.css?v=6"
  >


  <!-- ACESSÓRIOS -->

  <link
    rel="stylesheet"
    href="accessories.css?v=26"
  >


</head>


<body>


  <main class="game">


    <h1>
      ᑕIᑎᑎᗩᗰOᑎᖇOᒪᒪ ☁️
    </h1>


    <!-- ========================= -->
    <!-- STATUS -->
    <!-- ========================= -->

    <div class="status-panel">


      <div class="status">

        <span class="status-icon">
          ❤️
        </span>

        <div class="status-info">

          <span>
            Felicidade
          </span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="happiness-bar"
            ></div>

          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-icon">
          🍰
        </span>

        <div class="status-info">

          <span>
            Comida
          </span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="hunger-bar"
            ></div>

          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-icon">
          ⚡
        </span>

        <div class="status-info">

          <span>
            Energia
          </span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="energy-bar"
            ></div>

          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-icon">
          🫧
        </span>

        <div class="status-info">

          <span>
            Higiene
          </span>

          <div class="status-bar">

            <div
              class="status-fill"
              id="hygiene-bar"
            ></div>

          </div>

        </div>

      </div>


    </div>


    <!-- ========================= -->
    <!-- CÔMODO -->
    <!-- ========================= -->

    <section
      class="room"
      data-room="home"
    >


      <!-- ========================= -->
      <!-- PERSONAGEM -->
      <!-- ========================= -->

      <div class="cinna-wrap">


        <!--
          EFEITOS LIVRES:
          corações, bolhas e Zzz
        -->

        <div
          id="effect-layer"
          class="effect-layer"
        ></div>


        <!--
          CORPO DO CINNA
          Tudo aqui dentro se move junto
        -->

        <div
          id="cinna-body"
          class="cinna-body"
        >


          <!-- CINNA -->

          <img
            id="cinna"
            class="character"
            src="assets/sprites/cinna-idle-1.PNG"
            alt="Cinna"
          >


          <!-- ACESSÓRIOS -->

          <div
            id="cinna-accessories-layer"
            class="cinna-accessories-layer"
          ></div>


          <!-- SUJEIRA -->

          <img
            id="dirt-overlay"
            class="dirt-overlay"
            src="assets/sprites/sujeira-1.PNG"
            alt=""
            hidden
          >


        </div>


      </div>


      <!-- ========================= -->
      <!-- MENU -->
      <!-- ========================= -->

      <nav class="game-menu">


        <button
          class="menu-button active"
          data-room="home"
          type="button"
        >

          <span>
            🏠
          </span>

          <small>
            Início
          </small>

        </button>


        <button
          class="menu-button"
          data-room="kitchen"
          type="button"
        >

          <span>
            🍰
          </span>

          <small>
            Comida
          </small>

        </button>


        <button
          class="menu-button"
          data-room="bathroom"
          type="button"
        >

          <span>
            🫧
          </span>

          <small>
            Banho
          </small>

        </button>


        <button
          class="menu-button"
          data-room="bedroom"
          type="button"
        >

          <span>
            💡
          </span>

          <small>
            Dormir
          </small>

        </button>


        <button
          class="menu-button"
          data-room="games"
          type="button"
        >

          <span>
            🎮
          </span>

          <small>
            Jogos
          </small>

        </button>


      </nav>


      <!-- ========================= -->
      <!-- COMIDA -->
      <!-- ========================= -->

      <div
        id="food-tray"
        class="food-tray"
        hidden
      >


        <!-- MORANGO -->

        <button
          class="food-item"
          data-food="Morango"
          data-value="25"
          type="button"
        >

          <span>
            🍓
          </span>

          <small>
            +25%
          </small>

        </button>


        <!-- MAÇÃ -->

        <button
          class="food-item"
          data-food="Maçã"
          data-value="35"
          type="button"
        >

          <span>
            🍎
          </span>

          <small>
            +35%
          </small>

        </button>


        <!-- LEITE -->

        <button
          class="food-item"
          data-food="Leite"
          data-value="30"
          type="button"
        >

          <span>
            🥛
          </span>

          <small>
            +30%
          </small>

        </button>


        <!-- BOLO -->

        <button
          class="food-item"
          data-food="Bolo"
          data-value="50"
          type="button"
        >

          <span>
            🍰
          </span>

          <small>
            +50%
          </small>

        </button>


        <!-- ACHOCOLATADO -->

        <button
          class="food-item"
          data-food="Achocolatado"
          data-value="30"
          type="button"
          hidden
        >

          <span class="food-image-icon">

            <img
              src="assets/sprites/achocolatado.PNG"
              alt="Achocolatado"
            >

          </span>

          <small>
            +30%
          </small>

        </button>


      </div>


      <!-- ========================= -->
      <!-- BANHO -->
      <!-- ========================= -->

      <div
        id="bath-tray"
        class="bath-tray"
        hidden
      >


        <button
          class="bath-item"
          data-care="Esponja"
          data-value="25"
          type="button"
        >

          <span>
            🧽
          </span>

          <small>
            +25%
          </small>

        </button>


        <button
          class="bath-item"
          data-care="Sabonete"
          data-value="35"
          type="button"
        >

          <span>
            🧼
          </span>

          <small>
            +35%
          </small>

        </button>


        <button
          class="bath-item"
          data-care="Shampoo"
          data-value="40"
          type="button"
        >

          <span>
            🧴
          </span>

          <small>
            +40%
          </small>

        </button>


        <button
          class="bath-item"
          data-care="Enxágue"
          data-value="20"
          type="button"
        >

          <span>
            🚿
          </span>

          <small>
            +20%
          </small>

        </button>


      </div>


      <!-- ========================= -->
      <!-- SONO -->
      <!-- ========================= -->

      <div
        id="sleep-tray"
        class="sleep-tray"
        hidden
      >


        <button
          id="sleep-button"
          class="sleep-button"
          type="button"
        >

          <span>
            💡
          </span>

          <small>
            Dormir
          </small>

        </button>


      </div>


      <!-- ========================= -->
      <!-- MENSAGEM -->
      <!-- ========================= -->

      <p id="message">
        Cinna está esperando você ♡
      </p>


    </section>


  </main>


  <!-- ========================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================= -->


  <!-- JOGO PRINCIPAL -->

  <script
    src="game.js?v=9"
  ></script>


  <!-- MINIJOGOS -->

  <script
    src="games.js?v=3"
  ></script>


  <!-- LOJA / INVENTÁRIO -->

  <script
    src="shop.js?v=6"
  ></script>


  <!--
    EXPANSÃO DE COMIDAS

    Adiciona:
    - Achocolatado
    - animação de 3 frames
    - estoque
    - loja/inventário
    - máximo de 4 tipos na bandeja
    - alimento some ao chegar em x0
  -->

  <script
    src="food-expansion.js?v=1"
  ></script>


</body>

</html>
